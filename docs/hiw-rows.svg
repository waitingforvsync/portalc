<text x="76.0" y="180.0" font-size="12" text-anchor="end" fill="#1d1b18" font-weight="normal" xml:space="preserve">eye</text>
<line x1="80.0" y1="190.0" x2="790.0" y2="190.0" stroke="#8a8478" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/>
<text x="784.0" y="184.0" font-size="11" text-anchor="end" fill="#8a8478" font-weight="normal" xml:space="preserve">the middle row, 32</text>
<line x1="172.8" y1="143.6" x2="172.8" y2="236.4" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
<text x="172.8" y="135.6" font-size="11" text-anchor="middle" fill="#2563eb" font-weight="normal" xml:space="preserve">screen</text>
<text x="166.8" y="152.6" font-size="10" text-anchor="end" fill="#2563eb" font-weight="normal" xml:space="preserve">row 0</text>
<text x="166.8" y="238.4" font-size="10" text-anchor="end" fill="#2563eb" font-weight="normal" xml:space="preserve">row 64</text>
<line x1="312.0" y1="74.0" x2="312.0" y2="306.0" stroke="#8a8478" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/>
