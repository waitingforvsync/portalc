<text x="180.8" y="213.0" font-size="11" text-anchor="start" fill="#c2410c" font-weight="normal" xml:space="preserve" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">o = 20 rows</text>
<line x1="80.0" y1="350.0" x2="172.8" y2="350.0" stroke="#8a8478" stroke-width="1" stroke-linecap="round" marker-end="url(#ahg)" marker-start="url(#ahg)"/>
<text x="126.4" y="345.0" font-size="11" text-anchor="middle" fill="#8a8478" font-weight="normal" xml:space="preserve">64</text>
<line x1="80.0" y1="376.0" x2="312.0" y2="376.0" stroke="#8a8478" stroke-width="1" stroke-linecap="round" marker-end="url(#ahg)" marker-start="url(#ahg)"/>
<text x="196.0" y="371.0" font-size="11" text-anchor="middle" fill="#8a8478" font-weight="normal" xml:space="preserve">2 x 80: the screen's edge</text>
<line x1="80.0" y1="402.0" x2="451.2" y2="402.0" stroke="#8a8478" stroke-width="1" stroke-linecap="round" marker-end="url(#ahg)" marker-start="url(#ahg)"/>
<text x="265.6" y="397.0" font-size="11" text-anchor="middle" fill="#8a8478" font-weight="normal" xml:space="preserve">depth d = 256</text>
<text x="40.0" y="460.0" font-size="12" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">offset o = 64 x 8m / d  rows</text>
<text x="40.0" y="478.0" font-size="12" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">its log, in u8.8 (256ths of a row):</text>
<text x="40.0" y="496.0" font-size="12" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">  256 log2(2^8 x 64 x 8m / d) = (17 x 256 + log m) - log d = h.l - ld</text>
<text x="40.0" y="520.0" font-size="12" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">m = 10, d = 256:  4,352 + 850 - 2,048 = 3,154;  2^(3,154 / 256) = 5,120 = 20.0 rows</text>
</svg>
