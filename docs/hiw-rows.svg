<line x1="451.2" y1="74.0" x2="451.2" y2="306.0" stroke="#1d1b18" stroke-width="4" stroke-linecap="butt"/>
<text x="459.2" y="92.0" font-size="12" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">wall</text>
<line x1="80.0" y1="190.0" x2="451.2" y2="306.0" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round"/>
