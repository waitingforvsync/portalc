<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="820" height="620" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
<rect width="820" height="620" fill="#ffffff"/>
<text x="20.0" y="28.0" font-size="12" text-anchor="start" fill="#1d1b18" font-weight="bold" xml:space="preserve">T, the toggle buffer, after capture</text>
<image x="20" y="40" width="512" height="256" style="image-rendering:pixelated" href="data:image/png;base64,"/>
<text x="20.0" y="318.0" font-size="12" text-anchor="start" fill="#1d1b18" font-weight="bold" xml:space="preserve">The frame, after the fill</text>
<image x="20" y="330" width="512" height="256" style="image-rendering:pixelated" href="data:image/png;base64,"/>
<rect x="20.0" y="40.0" width="512.0" height="256.0" fill="none" stroke="#1d1b18" stroke-width="1"/>
<line x1="48.0" y1="36.0" x2="48.0" y2="300.0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
<line x1="48.0" y1="36.0" x2="48.0" y2="300.0" stroke="#c2410c" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 3"/>
<line x1="380.0" y1="36.0" x2="380.0" y2="300.0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
<line x1="380.0" y1="36.0" x2="380.0" y2="300.0" stroke="#c2410c" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 3"/>
<line x1="480.0" y1="36.0" x2="480.0" y2="300.0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
<line x1="480.0" y1="36.0" x2="480.0" y2="300.0" stroke="#c2410c" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 3"/>
<rect x="20.0" y="330.0" width="512.0" height="256.0" fill="none" stroke="#1d1b18" stroke-width="1"/>
<line x1="48.0" y1="326.0" x2="48.0" y2="590.0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
<line x1="48.0" y1="326.0" x2="48.0" y2="590.0" stroke="#c2410c" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 3"/>
<line x1="380.0" y1="326.0" x2="380.0" y2="590.0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
<line x1="380.0" y1="326.0" x2="380.0" y2="590.0" stroke="#c2410c" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 3"/>
<line x1="480.0" y1="326.0" x2="480.0" y2="590.0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
<line x1="480.0" y1="326.0" x2="480.0" y2="590.0" stroke="#c2410c" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 3"/>
<text x="48.0" y="604.0" font-size="10" text-anchor="middle" fill="#c2410c" font-weight="normal" xml:space="preserve">7</text>
<text x="380.0" y="604.0" font-size="10" text-anchor="middle" fill="#c2410c" font-weight="normal" xml:space="preserve">90</text>
<text x="480.0" y="604.0" font-size="10" text-anchor="middle" fill="#c2410c" font-weight="normal" xml:space="preserve">115</text>
<text x="552.0" y="50.0" font-size="11" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">cell 6, the eye's     0..128</text>
<text x="552.0" y="67.0" font-size="11" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">  wall v4-v0          0..7</text>
<text x="552.0" y="84.0" font-size="11" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">  soft v0-v5, into</text>
<text x="552.0" y="101.0" font-size="11" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">  cell 2              7..128</text>
<text x="552.0" y="118.0" font-size="11" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">    wall v0-v1        7..90</text>
<text x="552.0" y="135.0" font-size="11" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">    soft v1-v6, into</text>
<text x="552.0" y="152.0" font-size="11" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">    cell 3            90..115</text>
<text x="552.0" y="169.0" font-size="11" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">      wall v1-v2      90..115</text>
<text x="552.0" y="186.0" font-size="11" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">    step v6-v5, into</text>
<text x="552.0" y="203.0" font-size="11" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">    cell 1            115..128</text>
<text x="552.0" y="220.0" font-size="11" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">      step v6-v7, into</text>
<text x="552.0" y="237.0" font-size="11" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">      cell 3 again    115..128</text>
<text x="552.0" y="254.0" font-size="11" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">        wall v1-v2    115..128</text>
<text x="552.0" y="300.0" font-size="11" text-anchor="start" fill="#8a8478" font-weight="normal" xml:space="preserve">Every toggle is a colour change.</text>
<text x="552.0" y="316.0" font-size="11" text-anchor="start" fill="#8a8478" font-weight="normal" xml:space="preserve">The fill runs down each byte column,</text>
<text x="552.0" y="332.0" font-size="11" text-anchor="start" fill="#8a8478" font-weight="normal" xml:space="preserve">starting from cell 6's ceiling, and</text>
<text x="552.0" y="348.0" font-size="11" text-anchor="start" fill="#8a8478" font-weight="normal" xml:space="preserve">EORs each row with what's toggled</text>
<text x="552.0" y="364.0" font-size="11" text-anchor="start" fill="#8a8478" font-weight="normal" xml:space="preserve">there: ceiling to wall at the top</text>
<text x="552.0" y="380.0" font-size="11" text-anchor="start" fill="#8a8478" font-weight="normal" xml:space="preserve">line, wall to floor at the bottom.</text>
<text x="552.0" y="412.0" font-size="11" text-anchor="start" fill="#8a8478" font-weight="normal" xml:space="preserve">Cell 3's wall is made twice: once</text>
<text x="552.0" y="428.0" font-size="11" text-anchor="start" fill="#8a8478" font-weight="normal" xml:space="preserve">for each visit to cell 3.</text>
</svg>
