<text x="784.0" y="66.0" font-size="11" text-anchor="end" fill="#8a8478" font-weight="normal" xml:space="preserve">ceiling: 8m = 80 units above the eye</text>
<text x="784.0" y="323.0" font-size="11" text-anchor="end" fill="#8a8478" font-weight="normal" xml:space="preserve">floor: 8m = 80 units below</text>
