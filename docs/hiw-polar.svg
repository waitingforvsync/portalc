<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
<rect width="820" height="500" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1b18"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
<line x1="280.0" y1="510.0" x2="280.0" y2="70.0" stroke="#8a8478" stroke-width="1.2" stroke-linecap="round"/>
<line x1="70.0" y1="300.0" x2="510.0" y2="300.0" stroke="#8a8478" stroke-width="1.2" stroke-linecap="round"/>
<text x="280.0" y="62.0" font-size="12" text-anchor="middle" fill="#8a8478" font-weight="normal" xml:space="preserve">+x  (0)</text>
<text x="510.0" y="292.0" font-size="12" text-anchor="end" fill="#8a8478" font-weight="normal" xml:space="preserve">+y (256)</text>
<text x="280.0" y="528.0" font-size="12" text-anchor="middle" fill="#8a8478" font-weight="normal" xml:space="preserve">-x (512)</text>
<text x="70.0" y="292.0" font-size="12" text-anchor="start" fill="#8a8478" font-weight="normal" xml:space="preserve">-y (768)</text>
<line x1="280.0" y1="300.0" x2="414.4" y2="165.6" stroke="#d8d2c4" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/>
<line x1="280.0" y1="300.0" x2="414.4" y2="434.4" stroke="#d8d2c4" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/>
<line x1="280.0" y1="300.0" x2="145.6" y2="434.4" stroke="#d8d2c4" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/>
<line x1="280.0" y1="300.0" x2="145.6" y2="165.6" stroke="#d8d2c4" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/>
<text x="400.0" y="150.0" font-size="12" text-anchor="middle" fill="#8a8478" font-weight="normal" xml:space="preserve">quadrant 0</text>
<text x="400.0" y="164.0" font-size="11" text-anchor="middle" fill="#8a8478" font-weight="normal" xml:space="preserve">+x +y</text>
<text x="400.0" y="440.0" font-size="12" text-anchor="middle" fill="#8a8478" font-weight="normal" xml:space="preserve">quadrant 1</text>
<text x="400.0" y="454.0" font-size="11" text-anchor="middle" fill="#8a8478" font-weight="normal" xml:space="preserve">-x +y</text>
<text x="160.0" y="440.0" font-size="12" text-anchor="middle" fill="#8a8478" font-weight="normal" xml:space="preserve">quadrant 2</text>
<text x="160.0" y="454.0" font-size="11" text-anchor="middle" fill="#8a8478" font-weight="normal" xml:space="preserve">-x -y</text>
<text x="160.0" y="150.0" font-size="12" text-anchor="middle" fill="#8a8478" font-weight="normal" xml:space="preserve">quadrant 3</text>
<text x="160.0" y="164.0" font-size="11" text-anchor="middle" fill="#8a8478" font-weight="normal" xml:space="preserve">+x -y</text>
<line x1="280.0" y1="300.0" x2="280.0" y2="113.4" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
<line x1="280.0" y1="113.4" x2="342.6" y2="113.4" stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>
<line x1="280.0" y1="300.0" x2="342.6" y2="113.4" stroke="#1d1b18" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="342.6" cy="113.4" r="4.5" fill="#1d1b18" stroke="none" stroke-width="1"/>
<circle cx="280.0" cy="300.0" r="5" fill="#1d1b18" stroke="none" stroke-width="1"/>
<text x="270.0" y="318.0" font-size="12" text-anchor="end" fill="#1d1b18" font-weight="normal" xml:space="preserve">eye</text>
<text x="352.6" y="118.4" font-size="12" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">vertex</text>
<text x="272.0" y="206.7" font-size="12" text-anchor="end" fill="#2563eb" font-weight="normal" xml:space="preserve" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">major |dx| = 301</text>
<text x="284.0" y="103.4" font-size="12" text-anchor="start" fill="#15803d" font-weight="normal" xml:space="preserve" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">minor |dy| = 101</text>
<text x="333.3" y="236.7" font-size="14" text-anchor="middle" fill="#1d1b18" font-weight="bold" xml:space="preserve" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">r</text>
<path d="M280.0,230.0 A70,70 0 0 1 302.3,233.6" fill="none" stroke="#c2410c" stroke-width="1.6"/>
<text x="292.0" y="222.0" font-size="14" text-anchor="start" fill="#c2410c" font-weight="bold" xml:space="preserve" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">φ</text>
<text x="510.0" y="70.0" font-size="13" text-anchor="start" fill="#1d1b18" font-weight="bold" xml:space="preserve">The polar form of (301, 101)</text>
<text x="510.0" y="96.0" font-size="12" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">in half units: the eye is mid-square</text>
<text x="510.0" y="113.0" font-size="12" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">quadrant   from the signs: 0</text>
<text x="510.0" y="130.0" font-size="12" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">shallow    |dx| &gt; |dy|: x is the major</text>
<text x="510.0" y="164.0" font-size="12" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">log major  log2 301 = 2,108</text>
<text x="510.0" y="181.0" font-size="12" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">log minor  log2 101 = 1,705</text>
<text x="510.0" y="215.0" font-size="12" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">ratio byte 256 minor / major</text>
<text x="510.0" y="232.0" font-size="12" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">           = 2^((1,705 - 2,108)/256 + 8)</text>
<text x="510.0" y="249.0" font-size="12" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">           = 86</text>
<text x="510.0" y="283.0" font-size="12" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">φ          atan[86] = 53 steps</text>
<text x="510.0" y="300.0" font-size="12" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">log r      2,108 + lhyp[86] = 2,128</text>
<text x="510.0" y="334.0" font-size="12" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">angle      quadrant 0, byte 53</text>
<text x="510.0" y="351.0" font-size="12" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">           (true: 52.76)</text>
<text x="510.0" y="368.0" font-size="12" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">length     2^(2,128 / 256) = 318</text>
<text x="510.0" y="385.0" font-size="12" text-anchor="start" fill="#1d1b18" font-weight="normal" xml:space="preserve">           (true: 317.5)</text>
<text x="510.0" y="425.0" font-size="11" text-anchor="start" fill="#8a8478" font-weight="normal" xml:space="preserve">t = minor/major = tan φ, so</text>
<text x="510.0" y="440.0" font-size="11" text-anchor="start" fill="#8a8478" font-weight="normal" xml:space="preserve">r = major sec φ = major √(1 + tan² φ)</text>
<text x="510.0" y="455.0" font-size="11" text-anchor="start" fill="#8a8478" font-weight="normal" xml:space="preserve">lhyp = 256 log2 sec φ = 128 log2(1 + t²)</text>
</svg>
